<?xml version="1.0" encoding="UTF-8"?>
<!-- assets/slaidshow-logo.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="72" viewBox="0 0 256 72" role="img" aria-label="slAIdshow logo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00D1B2"/>
      <stop offset="1" stop-color="#6C5CE7"/>
    </linearGradient>
    <style>
      .word { font: 700 24px/1.1 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, "Noto Sans", Arial, sans-serif; letter-spacing: 0.5px; }
      .accent { fill: url(#g); }
      .muted { fill: #1F2937; }
      @media (prefers-color-scheme: dark){
        .muted { fill: #E5E7EB; }
      }
    </style>
  </defs>

  <!-- Icon: speech-bubble mouth with screen inside -->
  <g transform="translate(8,8)">
    <!-- Mouth / speech-bubble outline -->
    <path d="M2 18 Q2 4 24 4 Q46 4 46 18 Q46 36 30 39 L14 50 L17 37 Q2 36 2 18 Z"
          fill="none" stroke="url(#g)" stroke-width="3" stroke-linejoin="round"/>
    <!-- Upper lip -->
    <path d="M8 14 Q24 8 40 14"
          fill="none" stroke="url(#g)" stroke-width="2" stroke-linecap="round"/>
    <!-- Lower lip (same span as upper, centred) -->
    <path d="M8 28 Q24 38 40 28"
          fill="none" stroke="url(#g)" stroke-width="2" stroke-linecap="round"/>

    <!-- Screen (centred in mouth) -->
    <rect x="13" y="14" width="22" height="15" rx="2"
          fill="none" stroke="url(#g)" stroke-width="2"/>
    <!-- Stand -->
    <line x1="21" y1="29" x2="27" y2="29"
          stroke="url(#g)" stroke-width="2" stroke-linecap="round"/>
    <!-- Mountain (peak left) -->
    <polyline points="16,27 21,22 26,27"
              fill="none" stroke="url(#g)" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Sun (right of peak) -->
    <circle cx="29" cy="19" r="2" fill="url(#g)"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(70,18)">
    <text class="word muted" x="0" y="20">sl</text>
    <text class="word accent" x="28" y="20">AI</text>
    <text class="word muted" x="62" y="20">dshow</text>
  </g>
</svg>
